[project]
name = "mnemosyne"
version = "0.2.0"
description = "Mnemosyne — a persistent, adaptive engineering memory for AI coding assistants."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Optional LLM extraction of preferences from session transcripts.
llm = ["anthropic>=1.11"]
# Local neural embeddings instead of the built-in hashing embedder.
local-embeddings = ["sentence-transformers>=3.0"]
# PostgreSQL deployments.
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.6",
    "anthropic>=1.11",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: slower integration-style tests (e.g. real Alembic migrations)",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "UP007",   # Optional[X] is used deliberately for readability alongside dataclasses
    "UP045",
    "RUF001",  # typographic characters in user-facing strings are intentional
    "RUF002",
    "RUF003",
    "SIM108",
    "SIM905",  # whitespace-split word lists are clearer than giant list literals
    "UP042",   # (str, Enum) is deliberate: StrEnum would change str() of existing enums
    "UP035",
    "B008",    # FastAPI's Depends()/Query() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"src/mnemosyne/migrations/versions/*.py" = ["E501", "I001", "UP035"]
"tests/**/*.py" = ["B017", "SIM117"]
"src/mnemosyne/evaluation/persona.py" = ["E501"]  # labeled evaluation data
