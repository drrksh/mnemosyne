name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests benchmarks
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mnemosyne
          POSTGRES_PASSWORD: mnemosyne
          POSTGRES_DB: mnemosyne_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mnemosyne"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MNEMOSYNE_TEST_POSTGRES_URL: postgresql+psycopg://mnemosyne:mnemosyne@localhost:5432/mnemosyne_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q --cov=mnemosyne --cov-report=term-missing:skip-covered

  quality:
    # Retrieval quality and hook latency are product properties: a change that
    # regresses them should be visible in review, not discovered by users.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: mnemosyne eval
      - run: mnemosyne eval --heldout
      - run: python benchmarks/hook_latency.py --runs 10

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mnemosyne:ci .
      - name: Container starts, migrates and reports healthy
        run: |
          docker run -d --name mn -p 8420:8420 \
            -e MNEMOSYNE_DATABASE_URL=sqlite:////data/mnemosyne.db mnemosyne:ci
          for i in $(seq 1 30); do curl -fs localhost:8420/ready && break; sleep 1; done
          curl -fs localhost:8420/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8420/api/v1/memories)" = "401"
